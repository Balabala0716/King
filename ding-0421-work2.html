<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弦音雅集｜古筝社春季招新</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:"Noto Serif SC",serif;
  background-color:#f7f2e6;
}
/* 横幅区域，背景图在这里替换 */
.banner{
  position:relative;
  min-height:90vh;
  padding:6rem 2rem;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#f3ede0;
  /* 渐变遮罩 + 背景图，修改url里的图片 */
  background:
    linear-gradient(180deg, rgba(22,20,18,0.58) 0%, rgba(38,34,28,0.48) 60%, rgba(54,48,40,0.42) 100%),
    url("banner.jpg") center center / cover no-repeat;
}
.banner .small-top{
  font-size:1.1rem;
  letter-spacing:4px;
  margin-bottom:24px;
  opacity:0.85;
}
.banner h1{
  font-size:clamp(3.2rem,8vw,7rem);
  font-weight:500;
  letter-spacing:12px;
  margin-bottom:18px;
}
.banner .slogan{
  font-size:1.3rem;
  letter-spacing:2px;
  opacity:0.82;
  margin-bottom:36px;
}
.banner .desc{
  max-width:720px;
  font-size:1.05rem;
  line-height:1.9;
  opacity:0.78;
  margin-bottom:48px;
}
.banner .info-line{
  font-size:1rem;
  letter-spacing:1px;
  opacity:0.85;
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  justify-content:center;
}
/* 装饰小点（原图上的棕色方块） */
.banner::before,
.banner::after,
.dot1,.dot2,.dot3,.dot4{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  background:#947c5c;
  border-radius:2px;
  opacity:0.75;
}
.dot1{top:22%; left:15%;}
.dot2{top:38%; left:30%;}
.dot3{top:51%; left:44%;}
.dot4{top:64%; left:62%;}
.banner::after{top:78%; left:78%;}
/* 横向细分割线，和原图线条效果匹配 */
.banner > div{
  position:absolute;
  left:0;
  width:100%;
  height:1px;
  background:rgba(255,255,255,0.12);
}
.line1{top:24%;}
.line2{top:42%;}
.line3{top:56%;}
.line4{top:70%;}
</style>
</head>
<body>
<section class="banner">
  <!-- 装饰横线 -->
  <div class="line1"></div>
  <div class="line2"></div>
  <div class="line3"></div>
  <div class="line4"></div>
  <!-- 装饰小点 -->
  <span class="dot1"></span>
  <span class="dot2"></span>
  <span class="dot3"></span>
  <span class="dot4"></span>

  <div class="small-top">校园古筝社 · 2026 春季招新</div>
  <h1>弦音雅集</h1>
  <div class="slogan">二十一根弦，等你来拨第一声</div>
  <div class="desc">
    每周一次的琴房灯光、十几双按在弦上的手，还有一个空着的位子。零基础也收，琴我们也备好了。
  </div>
  <div class="info-line">
    <span>活动时间 每周四 19:00—21:00</span>
    <span>活动地点 学生活动中心 民乐教室 302</span>
    <span>招新对象 全校在读学生，不限年级</span>
  </div>
</section>
</body>
</html>
