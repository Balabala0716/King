    <h1>🥁 打击乐社活动介绍</h1>
    <p>打击乐社日常开展基础节奏训练、乐器教学、合奏排练、舞台演出和即兴交流活动。社团每周开放排练教室，为社员提供练习空间。零基础同学可以从握棒姿势、节拍训练开始学习，有基础的同学可以加入合奏和演出准备。</p>
    <p>我们会参与校园迎新晚会、音乐节、社团文化节等活动，也会组织内部音乐分享会。无论你喜欢架子鼓、卡洪鼓、康加鼓还是小军鼓，都可以在这里找到适合自己的节奏。</p>
