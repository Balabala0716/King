    <h1>🥁打击乐社活动详情介绍</h1>
    <p>打击乐社主要开展乐器零基础教学、节奏基本功训练、乐队合奏排练、舞台汇演、即兴jam聚会。社团每周开放排练教室供社员自由练习。每学期开设面向全校的打击乐公益公开课，零基础同学也可以参与学习。社团积极参加学校迎新晚会、校园音乐节、各类文艺汇演，给社员大量登台表演机会。除正式排练之外，社团定期举办音乐分享会，赏析国内外优秀打击乐演奏作品。我们欢迎所有热爱节奏的同学加入我们。</p>
